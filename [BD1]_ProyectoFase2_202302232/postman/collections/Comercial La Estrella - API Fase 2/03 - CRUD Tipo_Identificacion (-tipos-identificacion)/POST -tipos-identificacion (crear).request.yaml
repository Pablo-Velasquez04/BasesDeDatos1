$kind: http-request
name: POST /tipos-identificacion (crear)
url: http://localhost:3000/api/tipos-identificacion
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Nombre_Identificacion": "Tipo {{$timestamp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('nuevoId', pm.response.json().Id_Tipo_Id);
    language: text/javascript
order: 3000
