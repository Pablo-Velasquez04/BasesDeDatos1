$kind: http-request
name: PUT /tipos-identificacion/:id (actualizar)
url: http://localhost:3000/api/tipos-identificacion/{{nuevoId}}
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Nombre_Identificacion": "Tipo editado {{$timestamp}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
