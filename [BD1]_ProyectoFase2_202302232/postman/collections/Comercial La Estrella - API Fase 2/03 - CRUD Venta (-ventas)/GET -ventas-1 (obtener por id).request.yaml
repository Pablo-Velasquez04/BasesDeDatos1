$kind: http-request
name: GET /ventas/1 (obtener por id)
url: http://localhost:3000/api/ventas/1
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Trae Numero_Venta', () => pm.expect(pm.response.json()).to.have.property('Numero_Venta'));
    language: text/javascript
order: 2000
