$kind: http-request
name: POST /ventas (crear)
url: http://localhost:3000/api/ventas
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Fecha": "2026-10-13",
      "Tienda_Id_Tienda": 1,
      "Empleado_Codigo_Empleado": 1,
      "Cliente_Codigo_Cliente": 1,
      "Estado_Venta_Id_Estado": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('nuevoId', pm.response.json().Numero_Venta);
    language: text/javascript
order: 3000
