$kind: http-request
name: POST /tiendas (crear)
url: http://localhost:3000/api/tiendas
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Nombre": "Tienda {{$timestamp}}",
      "Direccion": "6a avenida 10-20 zona 1",
      "Telefono": "22223333",
      "Municipio_Id_Municipio": 1,
      "Tipo_Tienda_Id_Tipo_Tienda": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('nuevoId', pm.response.json().Id_Tienda);
    language: text/javascript
order: 3000
