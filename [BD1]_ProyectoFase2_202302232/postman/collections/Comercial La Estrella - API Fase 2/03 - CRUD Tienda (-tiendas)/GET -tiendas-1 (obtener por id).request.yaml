$kind: http-request
name: GET /tiendas/1 (obtener por id)
url: http://localhost:3000/api/tiendas/1
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Trae Id_Tienda', () => pm.expect(pm.response.json()).to.have.property('Id_Tienda'));
    language: text/javascript
order: 2000
