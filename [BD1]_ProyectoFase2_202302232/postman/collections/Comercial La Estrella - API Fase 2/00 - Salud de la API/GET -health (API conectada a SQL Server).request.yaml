$kind: http-request
name: GET /health (API conectada a SQL Server)
url: http://localhost:3000/api/health
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('17 tablas, 3 vistas y 2 triggers', () => {
        const r = pm.response.json();
        pm.expect(r.tablas).to.eql(17); pm.expect(r.vistas).to.eql(3); pm.expect(r.triggers).to.eql(2);
      });
    language: text/javascript
order: 1000
