$kind: http-request
name: POST /departamentos (crear)
url: http://localhost:3000/api/departamentos
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Nombre": "Depto {{$timestamp}}",
      "Pais_Codigo_Pais": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('nuevoId', pm.response.json().Id_Departamento);
    language: text/javascript
order: 3000
