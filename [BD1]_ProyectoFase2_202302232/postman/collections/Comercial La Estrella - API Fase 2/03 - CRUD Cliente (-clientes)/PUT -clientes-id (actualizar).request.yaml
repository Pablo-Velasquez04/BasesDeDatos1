$kind: http-request
name: PUT /clientes/:id (actualizar)
url: http://localhost:3000/api/clientes/{{nuevoId}}
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Nombres": "Cliente editado",
      "Apellidos": "Prueba",
      "Numero_Identificacion": "{{$timestamp}}",
      "Correo": "cliente{{$timestamp}}@correo.com",
      "Direccion": "Zona 11",
      "Id_Municipio": 1,
      "Tipo_Identificacion_Id_Tipo_Id": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
