$kind: http-request
name: POST /empleados (crear)
url: http://localhost:3000/api/empleados
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Nombres": "Empleado",
      "Apellidos": "Prueba",
      "Correo": "empleado{{$timestamp}}@estrella.com",
      "Telefono": "55556666",
      "Fecha_Contratacion": "2026-01-15",
      "Tienda_Id_Tienda": 1,
      "Cargo_Empleado_Id_Cargo": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('nuevoId', pm.response.json().Codigo_Empleado);
    language: text/javascript
order: 3000
