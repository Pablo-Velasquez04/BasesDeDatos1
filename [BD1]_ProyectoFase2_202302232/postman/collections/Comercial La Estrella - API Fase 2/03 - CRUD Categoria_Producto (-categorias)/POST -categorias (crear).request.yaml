$kind: http-request
name: POST /categorias (crear)
url: http://localhost:3000/api/categorias
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Nombre": "Categoria {{$timestamp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('nuevoId', pm.response.json().Codigo_Categoria);
    language: text/javascript
order: 3000
