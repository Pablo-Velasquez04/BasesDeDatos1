$kind: http-request
name: POST /cargos-empleado (crear)
url: http://localhost:3000/api/cargos-empleado
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Nombre_Cargo": "Cargo {{$timestamp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('nuevoId', pm.response.json().Id_Cargo);
    language: text/javascript
order: 3000
