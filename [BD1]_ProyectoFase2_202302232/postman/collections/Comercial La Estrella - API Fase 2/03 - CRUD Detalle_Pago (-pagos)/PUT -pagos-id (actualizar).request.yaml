$kind: http-request
name: PUT /pagos/:id (actualizar)
url: http://localhost:3000/api/pagos/{{nuevoId}}
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Monto_Pagado": 12,
      "Venta_Numero_Venta": {{ventaId}},
      "Metodo_Pago_Id_Metodo": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
