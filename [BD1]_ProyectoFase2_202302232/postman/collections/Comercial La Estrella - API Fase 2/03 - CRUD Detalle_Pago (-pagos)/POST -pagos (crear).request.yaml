$kind: http-request
name: POST /pagos (crear)
url: http://localhost:3000/api/pagos
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Monto_Pagado": 10,
      "Venta_Numero_Venta": {{ventaId}},
      "Metodo_Pago_Id_Metodo": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('nuevoId', pm.response.json().Id_Pago);
    language: text/javascript
order: 3000
