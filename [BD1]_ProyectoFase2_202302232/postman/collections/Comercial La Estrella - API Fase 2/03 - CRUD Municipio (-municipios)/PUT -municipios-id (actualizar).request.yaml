$kind: http-request
name: PUT /municipios/:id (actualizar)
url: http://localhost:3000/api/municipios/{{nuevoId}}
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Nombre": "Municipio editado {{$timestamp}}",
      "Departamento_Id_Departamento": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
