$kind: http-request
name: GET /municipios/1 (obtener por id)
url: http://localhost:3000/api/municipios/1
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Trae Id_Municipio', () => pm.expect(pm.response.json()).to.have.property('Id_Municipio'));
    language: text/javascript
order: 2000
