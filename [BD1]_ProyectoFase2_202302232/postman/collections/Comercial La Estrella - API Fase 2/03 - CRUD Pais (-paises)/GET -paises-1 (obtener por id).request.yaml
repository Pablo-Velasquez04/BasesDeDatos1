$kind: http-request
name: GET /paises/1 (obtener por id)
url: http://localhost:3000/api/paises/1
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Trae Codigo_Pais', () => pm.expect(pm.response.json()).to.have.property('Codigo_Pais'));
    language: text/javascript
order: 2000
