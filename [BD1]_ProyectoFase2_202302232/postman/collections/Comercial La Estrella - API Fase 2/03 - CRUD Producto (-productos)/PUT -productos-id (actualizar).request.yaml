$kind: http-request
name: PUT /productos/:id (actualizar)
url: http://localhost:3000/api/productos/{{nuevoId}}
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Nombre": "Producto editado {{$timestamp}}",
      "Descripcion": "Producto de prueba editado",
      "Precio": 175.25,
      "Existencia_Actual": 90,
      "Categoria_Codigo": 1,
      "Marca_Producto_Codigo": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
