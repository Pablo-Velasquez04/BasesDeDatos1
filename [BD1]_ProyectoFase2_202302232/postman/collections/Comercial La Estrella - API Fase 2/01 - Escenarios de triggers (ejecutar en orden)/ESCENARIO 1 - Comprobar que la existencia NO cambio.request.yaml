$kind: http-request
url: http://localhost:3000/api/productos/{{productoId}}
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('La existencia sigue igual (rollback)', () => pm.expect(pm.response.json().Existencia_Actual).to.eql(Number(pm.collectionVariables.get('stockAntes'))));
    language: text/javascript
order: 4000
