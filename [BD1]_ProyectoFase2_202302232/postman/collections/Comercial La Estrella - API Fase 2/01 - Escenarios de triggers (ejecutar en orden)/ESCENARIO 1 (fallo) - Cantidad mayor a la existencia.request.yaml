$kind: http-request
description: El trigger trg_Insert_Detalle cancela la transaccion y la API responde 400.
url: http://localhost:3000/api/detalles-venta
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Cantidad": 999999,
      "Precio_Unitario": 100,
      "Venta_Numero_Venta": {{ventaId}},
      "Producto_Codigo_Producto": {{productoId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('Mensaje "Stock insuficiente"', () => pm.expect(pm.response.json().error).to.eql('Stock insuficiente'));
    language: text/javascript
order: 3000
