$kind: http-request
name: POST /estados-venta (crear)
url: http://localhost:3000/api/estados-venta
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Tipo_Estado": "Estado {{$timestamp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('nuevoId', pm.response.json().Id_Estado);
    language: text/javascript
order: 3000
